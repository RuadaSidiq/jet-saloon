name: Scheduled jobs
# Vercel's free plan runs cron once a day; this calls the job endpoint every 5 minutes
# (booking reminders, settlement release, hold expiry, payment reconciliation, email/SMS delivery).
# Set repository secrets APP_URL (e.g. https://jet-saloon.vercel.app) and CRON_SECRET (same value as on Vercel).
on:
  schedule: [{ cron: "*/5 * * * *" }]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET secrets not set — skipping"; exit 0; fi
          curl -fsS --max-time 60 -X POST "$APP_URL/api/cron" -H "Authorization: Bearer $CRON_SECRET"
